[package]
name = "sc-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sc-diff.workspace = true
# The settings file. Small and hand-writable on purpose — a reviewer who wants
# to copy one document pair's excluded regions to another should be able to.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sc-match.workspace = true
sc-render.workspace = true

# The sweep hands the frontend the platform's own wakeup object so its event
# loop can watch it, rather than calling back from a worker thread onto code
# that wants to open a dialog. These are the two calls that takes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
sc-fixture.workspace = true
