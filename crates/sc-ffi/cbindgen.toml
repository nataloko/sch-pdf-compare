language = "C"
header = """/* sch-pdf-compare core — the C ABI. GENERATED BY cbindgen, DO NOT EDIT.
 *
 * Regenerated by `cargo build -p sc-ffi`; CI fails if the committed copy and
 * the source disagree. Edit `crates/sc-ffi/src/lib.rs` instead.
 *
 * Copyright (c) the sch-pdf-compare authors. AGPL-3.0-or-later; see LICENSE.
 */"""
include_guard = "SCHCOMPARE_H"
style = "type"
pragma_once = false
cpp_compat = true
usize_is_size_t = true
documentation_style = "doxy"
line_length = 78
tab_width = 4
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
